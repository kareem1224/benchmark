<style>
/* Benchmark: field-to-office QA. Calm dark workspace, 3D/2D stage on the left, work panel on the right; stacks on phones.
   One committed dark look. Pink = pins/brand, blue = selection/primary, yellow = requests/caution, green/red = pass/fail. */
:root {
  color-scheme: dark;
  --bg: #0e1418; --s1: #141c21; --s2: #1a242b; --s3: #223039; --s4: #2b3b45;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --paper: #eef3f5; --muted: #9db0b9; --faint: #6c818b;
  --accent: #5b8cff; --accent-2: #3f6fe0; --accent-soft: rgba(91,140,255,.16);
  --pink: #ff4f8b; --yellow: #f5b82e; --blue: #5b8cff; --green: #2fb36d; --red: #ff8a80; --fail: #e5484d;
  --ink-on-light: #10181d;
  --slate: var(--s1); --slate-2: var(--s2); --slate-3: var(--s3);
  --r: 10px; --r-sm: 8px;
  --shadow: 0 8px 28px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.04) inset;
  --sign: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--paper); font-family: var(--body); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--sign); font-weight: 650; margin: 0; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
[hidden] { display: none !important; }
a { color: var(--paper); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--s1); }
.brand { display: flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; background: none; border: 0; padding: 0; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; flex-wrap: wrap; }
.crumb select { max-width: 280px; background: var(--s2); border-color: transparent; font-weight: 550; }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--s3); }
.me { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #5b8cff, #ff4f8b); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

/* ---------- controls ---------- */
select, .input { background: var(--s1); border: 1px solid var(--line2); border-radius: var(--r-sm); height: 36px; padding: 0 10px; min-width: 0; transition: border-color .15s; }
select:hover, .input:hover { border-color: rgba(255,255,255,.22); }
textarea.input { height: auto; min-height: 72px; padding: 9px 10px; width: 100%; resize: vertical; line-height: 1.45; }
input.input { width: 100%; padding: 0 11px; }
.btn { height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: var(--s2); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover:not(:disabled) { background: var(--s3); border-color: rgba(255,255,255,.22); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn.danger { color: var(--red); border-color: rgba(229,72,77,.5); background: rgba(229,72,77,.08); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-decoration-color: rgba(157,176,185,.4); text-underline-offset: 3px; font-size: 12.5px; text-align: left; }
.link:hover { color: var(--paper); }

/* ---------- workspace ---------- */
.main { flex: 1; min-height: 0; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #1b262e 0%, #11181d 60%, #0d1317 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage.picking #gl, .stage.picking .sheetview { cursor: crosshair; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.flag { position: absolute; transform: translate(-1px, -100%); display: flex; flex-direction: column; align-items: flex-start; filter: drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
.flag button { pointer-events: auto; height: 24px; min-width: 24px; padding: 0 7px; border: 0; border-radius: 0 6px 6px 0; color: #fff; font-weight: 700; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.flag .stake { width: 2px; height: 20px; }
.flag.sel button { outline: 2px solid #fff; outline-offset: 1px; }
.flag.draft button { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.shot { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; color: #fff; pointer-events: auto; border: 0; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.shot::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 2px; height: 5px; background: inherit; transform: translateX(-50%); }
.mlabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; background: var(--yellow); color: var(--ink-on-light); font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.gpt { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--paper); color: var(--ink-on-light); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.apt { position: absolute; transform: translate(-50%, -50%); min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.hud { position: absolute; pointer-events: none; display: flex; gap: 8px; z-index: 3; }
.hud > * { pointer-events: auto; }
.hud-tl { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); flex-direction: column; align-items: flex-start; max-width: calc(100% - 420px); }
.hud-tr { top: 12px; right: 12px; flex-direction: column; align-items: flex-end; }
.hud-bl { bottom: 84px; left: max(12px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; align-items: center; right: 250px; }
.hud-br { bottom: 84px; right: 12px; flex-direction: column; align-items: flex-end; }
.glass, .card-hud { background: rgba(20,28,33,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.area-title { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.area-title small { color: var(--muted); font-size: 11.5px; display: block; font-weight: 500; }
.area-title h1 { font-size: 17px; }
.area-title .row { gap: 6px; }

/* bottom tool dock */
.dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 4px; padding: 6px; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; background: rgba(20,28,33,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 12px 34px rgba(0,0,0,.45); }
.dock::-webkit-scrollbar { display: none; }
.dock .sep { width: 1px; height: 30px; background: var(--line2); margin: 0 4px; flex-shrink: 0; }
.tool { min-width: 52px; height: 50px; padding: 0 6px; border: 0; border-radius: 11px; background: transparent; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; color: var(--muted); gap: 3px; flex-shrink: 0; transition: background .15s, color .15s; }
.tool:hover { background: var(--s3); color: var(--paper); }
.tool[aria-pressed="true"] { background: var(--accent); color: #fff; }
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool.warn { color: var(--yellow); }
.tool.warn[aria-pressed="true"] { background: var(--yellow); color: var(--ink-on-light); }

/* segmented controls */
.seg { display: flex; padding: 4px; gap: 2px; align-items: center; }
.seg button { height: 30px; padding: 0 11px; border: 0; border-radius: 8px; background: none; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover:not(:disabled) { color: var(--paper); background: var(--s3); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink-on-light); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg .sep { width: 1px; height: 20px; background: var(--line2); margin: 0 3px; }
.seg.mini button { height: 26px; padding: 0 9px; font-size: 12px; }
.revs { display: flex; align-items: center; gap: 4px; padding: 5px; flex-wrap: wrap; }
.rev { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.rev:hover { background: var(--s3); color: var(--paper); }
.rev[aria-pressed="true"] { background: var(--paper); color: var(--ink-on-light); }
.captured { color: var(--muted); font-size: 12px; padding: 0 8px; }
.legend { padding: 10px 12px; font-size: 11.5px; display: flex; flex-direction: column; gap: 5px; min-width: 180px; max-width: 230px; }
.legend b { font-size: 12px; }
.ramp { display: flex; gap: 7px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
.scalebar { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 7px 10px; font-size: 11px; font-weight: 600; }
.scalebar span { display: block; height: 6px; border: 2px solid var(--paper); border-top: 0; }
.hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: min(560px, calc(100% - 24px)); background: var(--paper); color: var(--ink-on-light); font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 999px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.35); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.hint select, .hint .btn { height: 28px; background: #fff; color: var(--ink-on-light); border-color: #c9d1d5; border-radius: 999px; }
.hint .btn:hover { background: #eef2f4; }
.empty-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); z-index: 2; }
.empty-stage > div { max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-stage .big { width: 56px; height: 56px; border-radius: 16px; background: var(--s2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.empty-stage .big svg { width: 26px; height: 26px; }

/* 2D sheets */
.sheetview { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: #2a333a; cursor: grab; }
.sheetview.dragging { cursor: grabbing; }
.sheet-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.sheet-inner img { display: block; user-select: none; -webkit-user-drag: none; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #fff; }
.sheet-pins { position: absolute; inset: 0; pointer-events: none; }
.sheet-tabs { display: flex; gap: 4px; padding: 5px; flex-wrap: wrap; max-width: 100%; }

/* ---------- panel ---------- */
.panel { width: 452px; flex-shrink: 0; border-left: 1px solid var(--line); background: var(--s1); display: flex; flex-direction: column; min-height: 0; }
.tab svg.i { width: 15px; height: 15px; }
.tabs { display: flex; gap: 0; padding: 8px 6px 0; border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1 0 auto; height: 40px; padding: 0 7px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 12.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--paper); background: var(--s2); }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
.tab span { font-weight: 600; font-size: 11px; color: var(--muted); background: var(--s3); border-radius: 9px; padding: 1px 6px; }
.tab span.bad { color: #fff; background: var(--fail); }
.tab span.ok { color: #fff; background: var(--green); }
.body { flex: 1; overflow-y: auto; min-height: 0; }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); font-size: 12px; }
.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.grid2 select, .grid2 input, .grid3 select, .grid3 input { width: 100%; }
.divide { border-top: 1px solid var(--line); }
.list { list-style: none; margin: 0; padding: 0; }
.item { width: 100%; text-align: left; background: none; border: 0; padding: 11px 16px; display: flex; gap: 11px; align-items: flex-start; border-radius: 0; transition: background .12s; }
.item:hover { background: var(--s2); }
.item .t { font-weight: 600; display: block; }
.item .m { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
.chip { flex-shrink: 0; height: 24px; min-width: 24px; padding: 0 6px; border-radius: 0 7px 7px 0; color: #fff; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; display: inline-block; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; background: var(--s2); }
.res { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 11.5px; font-weight: 700; color: #fff; white-space: nowrap; flex-shrink: 0; }
.res.pass { background: rgba(47,179,109,.18); color: #5be39a; } .res.fail { background: rgba(229,72,77,.18); color: #ff8f93; } .res.acc { background: rgba(91,140,255,.2); color: #9bb8ff; } .res.todo { background: var(--s3); color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.group-h { padding: 12px 16px 4px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.thread { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.thread li { background: var(--s2); border-radius: 10px; padding: 9px 12px; }
.thread .who-l { font-size: 12px; color: var(--muted); }
.thread .who-l b { color: var(--paper); font-weight: 600; }
.thread p { margin: 3px 0 0; white-space: pre-wrap; }
.box { border: 1px solid var(--line); background: var(--s2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.box.gate { border-width: 1px; border-left-width: 4px; }
.check { margin: 10px 12px 0; border: 1px solid var(--line); background: var(--s2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
.history { list-style: none; margin: 6px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--line2); display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.history span { color: var(--muted); display: block; }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.err { color: var(--red); font-size: 13px; margin: 0; }
.overdue { color: var(--red); font-weight: 600; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 7px 8px; border-bottom: 1px solid var(--line2); }
.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.guide { border: 1px solid rgba(91,140,255,.3); background: linear-gradient(180deg, rgba(91,140,255,.10), rgba(91,140,255,.03)); border-radius: 12px; padding: 14px; }
.guide h3 { font-size: 15px; margin-bottom: 8px; }
.guide ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.guide li.done { color: var(--faint); text-decoration: line-through; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos figure { margin: 0; display: flex; flex-direction: column; gap: 4px; width: 124px; }
.photos img { width: 124px; height: 94px; object-fit: cover; border-radius: 8px; background: var(--s3); }
.photos figure.vid { width: 200px; } .photos video { width: 200px; height: 130px; border-radius: 8px; background: #000; object-fit: cover; }
.media-list { display: flex; flex-direction: column; gap: 10px; }
.media-item { display: flex; flex-direction: column; gap: 4px; }
.media-item video { width: 100%; max-height: 260px; border-radius: 10px; background: #000; }
.job { position: fixed; left: 50%; bottom: max(84px, calc(env(safe-area-inset-bottom, 0px) + 76px)); transform: translateX(-50%); width: min(420px, calc(100% - 32px)); background: var(--s2); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; z-index: 79; display: flex; flex-direction: column; gap: 7px; box-shadow: var(--shadow); font-size: 13px; }
.live { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 8px; font-size: 12px; max-width: 100%; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,.2); flex-shrink: 0; }
.peer { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border-radius: 14px; border: 1px solid var(--line2); background: var(--s2); font-size: 12px; font-weight: 600; }
.peer:hover { background: var(--s3); }
.peer i { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #0d1418; font-style: normal; font-size: 10px; font-weight: 700; }
.peer[aria-pressed="true"] { background: var(--paper); color: var(--ink-on-light); }
.pcur { position: absolute; transform: translate(-50%, -50%); pointer-events: none; display: flex; align-items: center; gap: 4px; }
.pcur b { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.pcur span { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; color: #0d1418; white-space: nowrap; }
.ping { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--yellow); pointer-events: none; animation: ping 1.2s ease-out infinite; }
@keyframes ping { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } }
.req { border-left: 4px solid var(--yellow) !important; }
.req.now { border-left-color: var(--fail) !important; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; background: var(--fail); color: #fff; font-size: 11px; font-weight: 700; }

// ---------- Design ----------

  const approvals = a.approvals && a.approvals.length ? a.approvals : ["reviewer", "client"];
  return `<div class="pad">

    <div><h3 style="font-size:17px;margin-bottom:6px">${esc(kindOf(a).elems)}</h3>
      ${utils.length ? `<table class="t"><thead><tr><th>Element</th><th>Check</th>${edit ? "<th></th>" : ""}</tr></thead><tbody>${utils.map((u) => { const m = checkOf(u); return `<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="swatch" style="background:${UTIL_TYPES[u.type]?.color || "#999"}"></span><span>${esc(u.name)}${u.size ? `<br><span class="faint">${esc(u.size)}</span>` : ""}</span></span></td><td>${m === "depth" ? `Depth at least ${u.minCover != null ? u.minCover.toFixed(2) + " m" : "—"}${u.designCover != null ? `<br><span class="faint">Design ${u.designCover.toFixed(2)} m</span>` : ""}` : m === "elev" ? `Height ${fmtH(u.target)} ± ${Math.round((u.tol ?? 0.01) * 1000)} mm` : `<span class="faint">${u.existing ? "Existing, protect in place" : "Reference only"}</span>`}</td>${edit ? `<td style="white-space:nowrap"><button class="link" data-edit-util="${u.id}">Edit</button> · <button class="link" data-del-util="${u.id}">Remove</button></td>` : ""}</tr>`; }).join("")}</tbody></table>` : `<span class="muted">Nothing yet. Add what the scan should be checked against: a pipe's minimum depth, a form's top elevation, a deck's level.</span>`}
      ${edit ? utilForm(utils.find((u) => u.id === U.editUtil)) : ""}</div>
    ${designBox(a, edit)}
    <div class="box"><b>${esc(kindOf(a).ref)}</b><span class="muted">${ga.length ? `${ga.length} point${ga.length > 1 ? "s" : ""} set ${ga.length >= 3 ? "(sloped plane)" : ga.length === 2 ? "(slope along a line)" : "(level)"}. Depths and heights are measured from this.` : `Not set. Choose the ${kindOf(a).refTool} tool and tap ${kindOf(a).refPts}.`}</span>
      ${edit ? `<div class="row"><button class="btn sm" data-tool="grade">Set on the scan</button>${ga.length ? `<button class="btn sm" data-act="grade-clear">Clear</button>` : ""}</div>` : ""}</div>
    <div><h3 style="font-size:17px;margin-bottom:6px">${esc(kindOf(a).checklist)}</h3>${(a.checklist || []).map((it) => `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><span>${esc(it.text)}</span>${edit ? `<button class="link" data-del-item="${it.id}">Remove</button>` : ""}</div>`).join("") || `<span class="muted">No items.</span>`}
      ${edit ? `<form class="row" id="add-item" style="margin-top:8px;flex-wrap:nowrap"><input class="input" id="item-text" placeholder="Add an item" style="flex:1"><button class="btn sm" type="submit">Add</button></form>` : ""}</div>
    <div><h3 style="font-size:17px;margin-bottom:6px">Sign-off required from</h3>${edit ? `<div class="row">${Object.entries(ROLES).map(([k, v]) => `<label class="row" style="gap:6px"><input type="checkbox" data-approval="${k}" ${approvals.includes(k) ? "checked" : ""}> ${v}</label>`).join("")}</div>` : approvals.map((r) => ROLES[r]).join(", ")}</div>
  </div>`;
}
function designBox(a, edit) {
  const d = a.design, imp = U.designImport;
  if (imp) return `<div class="box"><b>Design model: ${esc(imp.fileName)}</b>${imp.error ? `<p class="err">${esc(imp.error)}</p><div class="row"><button class="btn sm" data-act="design-cancel">Close</button></div>` : `<div class="progress"><span style="width:${Math.round((imp.progress || 0) * 100)}%"></span></div><span class="faint">${esc(imp.stage || "")}</span>`}</div>`;
  if (!d) return `<div class="box"><b>Design model</b><span class="muted">Upload the 3D design (exported from Civil 3D, Revit, Tekla, SketchUp or any CAD as GLB, OBJ or PLY). Benchmark lines it up with the scan, colors every point by how far it sticks out of or falls short of the design, and flags problem zones.</span>
    ${edit ? `<div class="grid2"><div><label class="lbl" for="dm-units">Units in the file</label><select id="dm-units">${[["m", "Meters"], ["ft", "Feet"], ["mm", "Millimeters"], ["cm", "Centimeters"]].map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div><div><label class="lbl" for="dm-up">Up axis</label><select id="dm-up"><option value="auto">Detect</option><option value="z">Z up (most CAD)</option><option value="y">Y up</option></select></div></div><button class="btn primary sm" data-act="design-pick">Upload design model</button>` : ""}</div>`;
  const tolmm = Math.round((d.tol ?? 0.02) * 1000), pct = Math.round((d.passPct ?? 0.95) * 100);
  return `<div class="box" style="${d.aligned ? "" : "border-color:var(--yellow)"}"><div class="row between"><b>Design model</b><span class="faint">${esc(d.name || "")}</span></div>
    <span class="muted">${(d.n || 0).toLocaleString()} points · ${d.aligned ? `aligned to the scan${d.alignRms != null ? ` (residual ${(d.alignRms * 100).toFixed(1)} cm)` : ""}. Switch the view to <b>Vs design</b> to see where the work is high or low.` : "not aligned yet. Line it up with the scan so the comparison means something."}</span>
    ${edit ? `<form class="grid2" id="design-tol"><div><label class="lbl" for="dm-tol">Tolerance ± (mm)</label><input class="input" id="dm-tol" inputmode="decimal" value="${tolmm}"></div><div><label class="lbl" for="dm-pct">Pass when at least (%)</label><input class="input" id="dm-pct" inputmode="decimal" value="${pct}"></div><button class="btn sm" type="submit" style="grid-column:1/-1;justify-self:start">Save tolerance</button></form>
    <div class="row"><button class="btn sm ${d.aligned ? "" : "primary"}" data-act="design-align">${d.aligned ? "Re-align" : "Align to the scan"}</button>${d.aligned ? "" : `<button class="btn sm" data-act="design-same">Already in the same coordinates</button>`}<button class="btn sm" data-act="toggle-design">${U.showDesign ? "Hide model" : "Show model"}</button><button class="link" data-act="design-remove">Remove</button></div>` : `<span class="faint">Tolerance ±${tolmm} mm, pass at ${pct}% of points.</span>`}</div>`;
}
async function startDesignImport(file) {
  const a = area(); U.designImport = { fileName: file.name, progress: 0, stage: "Starting…" }; render();
  try {
    const res = await importScanFile(file, { units: U.dmUnits || "m", up: U.dmUp || "auto", design: true }, (p, stage) => { if (!U.designImport) return; U.designImport.progress = p; U.designImport.stage = stage; const bar = document.querySelector("#panel .progress > span"); if (bar) bar.style.width = Math.round(p * 100) + "%"; });
    if (res.text.length > 19.5 * 1024 * 1024) throw new Error("This model is too large. Export just this area.");
    U.designImport.stage = "Uploading…"; render();
    const assetId = await storeAsset(new Blob([res.text], { type: "text/plain" }), "text/plain");
    await updDoc("areas/" + a.id, { design: { assetId, n: res.n, name: file.name, transform: { yaw: 0, t: [0, 0, 0] }, aligned: false, tol: (a.design && a.design.tol) ?? 0.02, passPct: (a.design && a.design.passPct) ?? 0.95, by: ME.id, at: nowIso() } });
    U.designImport = null; U.showDesign = true; toast("Design model added. Now align it to the scan."); render();
  } catch (e) { if (U.designImport) { U.designImport.error = e && e.code ? dbErr(e) : (e && e.message) || "Couldn't read that model."; render(); } }
}

    <div class="grid2" data-for="elev" ${m === "elev" ? "" : "hidden"}><div><label class="lbl" for="uf-target">Target height (m, + is above)</label><input class="input" id="uf-target" inputmode="decimal" value="${u && u.target != null ? u.target : ""}"></div><div><label class="lbl" for="uf-tol">Tolerance ± (mm)</label><input class="input" id="uf-tol" inputmode="decimal" value="${u && u.tol != null ? Math.round(u.tol * 1000) : 10}"></div></div>

// ---------- Release ----------
function releaseTab() {
  const a = area(), rev = latestRev(), blockers = releaseBlockers(rev), released = isReleased();
  const approvals = a.approvals && a.approvals.length ? a.approvals : ["reviewer", "client"];
  const sigs = rev != null ? signoffsFor(a.id, rev) : [], myRole = role();
  const mySig = sigs.find((s) => s.uid === ME.id && s.role === myRole);
  return `<div class="pad"><div><h2 style="font-size:22px">${esc(kindOf(a).release)}</h2><span class="faint">${esc(kindOf(a).gate)} Release needs every check passing on the latest scan, high-priority issues closed, the checklist confirmed, and sign-off on that same scan.</span></div>
    <div class="box gate" style="border-color:${released ? "var(--green)" : blockers.length ? "var(--fail)" : "var(--blue)"}"><b>${released ? `${kindOf(a).released} on Rev ${rev}` : blockers.length ? `${blockers.length} item${blockers.length > 1 ? "s" : ""} blocking release` : "Ready for sign-off"}</b>
      ${released ? `<span class="muted">Rev ${rev} is the as-built record.</span>` : blockers.length ? `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px">${blockers.map((b) => `<li class="muted">${esc(b)}</li>`).join("")}</ul>` : `<span class="muted">Everything on Rev ${rev} checks out.</span>`}</div>
